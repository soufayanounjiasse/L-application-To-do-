# Pipeline d'intégration continue : les tests BDD se lancent à CHAQUE push (toutes les branches)
# et à chaque pull request. Le résultat apparaît dans l'onglet "Actions" du dépôt GitHub.
name: ci

on:
  push:
  pull_request:
  workflow_dispatch:        # permet aussi de le lancer à la main depuis l'onglet Actions

jobs:
  tests-bdd:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Installer le navigateur Chromium de Playwright
        run: npx playwright install --with-deps chromium

      - name: Lancer les tests BDD (Cucumber + Playwright)
        run: npm test

      - name: Publier les rapports de tests
        if: always()          # même si les tests échouent : on veut lire le rapport
        uses: actions/upload-artifact@v4
        with:
          name: rapports-bdd
          path: reports/
          if-no-files-found: ignore
